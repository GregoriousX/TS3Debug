; TS3Debug.asi - Toy Story 3 Complete Edition (PC) debug plugin
; Keys: F1..F12, a single letter/digit, or a virtual-key code like 0x20.
; (keep comments on their own lines - Windows INI parsing doesn't strip inline comments)

[General]
; Play the game's own "cheat on/off" voice line when toggling a cheat
VoiceFeedback=1

[Keys]
; free camera on/off
FreeCamera=F1
; 1st press: free camera on, 2nd: freeze it and give control back to the player, 3rd: off
FreeCameraDetach=F2
; game's own cheat list (Cheats::s_cheats)
God=F3
Stealth=F4
Ammo=F5
UnlockLevels=F6
StopTime=F7
; normal -> 2x -> 1/2x -> 1/4x -> 1/8x -> normal
TimeCycle=F8

; Free camera flight (a gamepad works too: left stick move, right stick look, RB/RT up/down)
CamForward=W
CamBack=S
CamLeft=A
CamRight=D
; Space / C
CamUp=0x20
CamDown=C
; arrow keys
LookUp=0x26
LookDown=0x28
LookLeft=0x25
LookRight=0x27
; Left Shift / Left Ctrl
CamFast=0xA0
CamSlow=0xA2

[FreeCamera]
KeyboardControl=1
FastMultiplier=3.0
SlowMultiplier=0.25
LookSpeed=1.0
; flip these if W flies backwards / Up arrow looks down
InvertForward=1
InvertPitch=0
