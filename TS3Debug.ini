; TS3Debug.asi - Toy Story 3 Complete Edition (PC) debug plugin
; Keys: F1..F12, a single letter/digit, or a virtual-key code like 0x20.
; (keep comments on their own lines - Windows INI parsing doesn't strip inline comments)

[General]
; Play the game's own "cheat on/off" voice line when toggling a cheat
VoiceFeedback=1
; Open the debug menu window as soon as the game starts
ShowMenuOnStart=0
; Frame advance: one press = one frame at this rate (while time is paused)
FrameStepFps=30
; How far in front of the player spawned actors appear
SpawnDistance=5.0
; God mode also blocks instant kills (falling off the level etc.).
; Off by default: with it on you can end up falling forever instead of respawning.
GodBlocksInstantKill=0

[Keys]
; debug menu window on/off
Menu=0x24
; free camera on/off
FreeCamera=F1
; 1st press: free camera on, 2nd: freeze it and give control back to the player, 3rd: off
FreeCameraDetach=F2
God=F3
Stealth=F4
Ammo=F5
; pause / resume time
Pause=F6
; game speed: normal -> 2x -> 1/2x -> 1/4x -> 1/8x -> normal
TimeCycle=F7
; pauses time if needed, then every press advances exactly one frame
FrameStep=F8
; actor spawner: Insert spawns, Page Down / Page Up change the selected actor
Spawn=0x2D
SpawnNext=0x22
SpawnPrev=0x21

; Free camera flight (a gamepad works too: left stick move, right stick look, RB/RT up/down)
CamForward=W
CamBack=S
CamLeft=A
CamRight=D
; Space / C
CamUp=0x20
CamDown=C
; arrow keys
LookUp=0x26
LookDown=0x28
LookLeft=0x25
LookRight=0x27
; Left Shift / Left Ctrl
CamFast=0xA0
CamSlow=0xA2

[FreeCamera]
KeyboardControl=1
FastMultiplier=3.0
SlowMultiplier=0.25
LookSpeed=1.0
; flip these if W flies backwards / Up arrow looks down
InvertForward=1
InvertPitch=0
